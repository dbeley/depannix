name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the release on tag
  id-token: write # build provenance attestation
  attestations: write

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, like the actions and nixpkgs. `ubuntu-latest` migrates to
          # Ubuntu 26 on 2026-10-19: left floating, the build chain would change
          # by itself one working day, with nobody having decided it. Aligned
          # with the arm64 runner, which is pinned too.
          - runner: ubuntu-24.04
            system: x86_64-linux
            kvm: true
          # The free arm64 runners do not expose /dev/kvm (an Azure ARM SKU
          # limitation, not an image one). So we build the aarch64 ISO but do not
          # boot it here: the aarch64 boot test stays manual. See docs/design.md.
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            kvm: false

    steps:
      - uses: actions/checkout@v5

      # Version pinned on purpose: `@main` can change without warning, and thus
      # break a build that used to work, or move the trust chain with no trace.
      # v22 is the latest at the time of writing.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # This action installs Determinate Nix by default, and that is what
          # makes it attempt a FlakeHub login: without a token the login fails
          # and leaves a warning on every run. `flakehub: false` does NOT stop
          # it — the input is deprecated and merely implies `determinate`. The
          # real lever is `determinate`, and switching it off keeps CI on
          # upstream Nix, the same one the development host runs. Verified not to
          # change the artifacts: both distributions produced the same ISO hash,
          # see docs/design.md.
          determinate: false

      - name: Disk headroom before build
        run: df -h /

      - name: Enable KVM (x86_64 only)
        if: matrix.kvm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

          # The runner user is not in the kvm group and we cannot reconnect
          # mid-job: the udev rule is the only workaround that works.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          # Fail immediately if KVM is not there: without this guard rail, QEMU
          # silently falls back to software emulation and the job times out.
          test -w /dev/kvm

      - name: Build the ISO
        run: nix build .#minimal --out-link result-iso -L

      - name: ISO size
        run: |
          iso=$(find result-iso/iso -name '*.iso' | head -1)
          ls -l "$iso"
          printf 'size: %s MiB\n' "$(( $(stat -c%s "$iso") / 1048576 ))"

      - name: Boot test (BIOS, then EFI)
        if: matrix.kvm
        run: |
          # /dev/kvm must be injected into the sandbox: without that, QEMU falls
          # back to software emulation and the job times out. Enabling KVM on the
          # runner is not enough by itself, because a `nix build` runs in a
          # sandbox that does not expose /dev/kvm.
          nix build --option extra-sandbox-paths /dev/kvm .#checks.${{ matrix.system }}.boot-test-bios --out-link result-boot-bios -L
          nix build --option extra-sandbox-paths /dev/kvm .#checks.${{ matrix.system }}.boot-test-efi --out-link result-boot-efi -L

      - name: Size guard
        run: nix build .#checks.${{ matrix.system }}.size-budget --out-link result-budget -L

      - name: Composition manifest
        run: nix build .#packages.${{ matrix.system }}.closure-manifest --out-link result-manifest -L

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: result-iso/iso/*.iso

      - uses: actions/upload-artifact@v7
        with:
          name: depannix-${{ matrix.system }}
          path: |
            result-iso/iso/*.iso
            result-manifest/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # download-artifact preserves the structure the upload used. The upload
    # matched two path patterns, so the least common ancestor is the repository
    # root and the files keep their prefixes. Verified by downloading an artifact
    # and listing it, rather than by reading the action's documentation.
    env:
      ISO_DIR: dist/result-iso/iso
      MANIFEST_DIR: dist/result-manifest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: depannix-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l "$ISO_DIR" "$MANIFEST_DIR"
          # Strip the directory prefix so the sums carry bare file names and
          # `sha256sum -c SHA256SUMS` works from the download directory.
          sha256sum "$ISO_DIR"/*.iso | sed "s|$ISO_DIR/||" > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # Signing stays optional: the job must not fail when the secret is not
      # configured, but we want to know whether it happened.
      - name: Detect the signing key
        id: sig
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY is absent — the release will not be signed"
          fi

      # The `release` job does not share the `build` job environment: without
      # this step, `nix` does not exist here and signing fails.
      - name: Install Nix (for minisign)
        if: steps.sig.outputs.enabled == 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      # minisign reads the password neither from the environment nor from stdin:
      # it asks the terminal, which CI does not have. The key stored in the
      # secret must therefore be UNENCRYPTED (`minisign -G -W`), otherwise this
      # step fails. It is the only non-interactive mode supported upstream.
      - name: Sign
        if: steps.sig.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.minisign
          printf '%s\n' "$MINISIGN_KEY" > ~/.minisign/depannix.key
          nix run nixpkgs#minisign -- -S -s ~/.minisign/depannix.key \
            -m dist/SHA256SUMS
          rm -f ~/.minisign/depannix.key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

      - name: Release notes
        run: |
          # Generated rather than left to --generate-notes, which on a first
          # release produces nothing but a changelog link. The release page is
          # where a visitor lands: it should say what the artefact is, how to
          # verify it, and what it does not do.
          {
            echo "Minimal NixOS rescue ISO: diagnosis, benchmarks, repair,"
            echo "partitioning and cloning. Boot tested under KVM by CI."
            echo
            echo "| asset | size |"
            echo "|---|---|"
            for iso in "$ISO_DIR"/*.iso; do
              awk -v f="$(basename "$iso")" -v s="$(stat -c%s "$iso")" \
                'BEGIN { printf "| `%s` | %d bytes (%.1f MiB) |\n", f, s, s / 1048576 }'
            done
            echo
            echo "One manifest per architecture, each file named after the one it describes:"
            echo
            for s in x86_64-linux aarch64-linux; do
              echo "- **$s**: $(wc -l < "$MANIFEST_DIR"/store-paths-$s.txt) store paths, $(cat "$MANIFEST_DIR"/total-nar-size-$s.txt) bytes of NAR."
            done
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/RELEASE_NOTES.md

          cat >> dist/RELEASE_NOTES.md <<'NOTES_EOF'

          ## Verify

          ```bash
          sha256sum -c SHA256SUMS
          ```

          The composition is published too, and can be checked against
          `cache.nixos.org` without trusting this build. The recipe is in
          `README-<system>.txt`, next to the manifest.
          NOTES_EOF

          # Signing is optional, and the release page must not claim the opposite
          # of what it ships: a hard-coded "not signed" section would quietly turn
          # into a lie the day the key is configured.
          if [ "${{ steps.sig.outputs.enabled }}" = "true" ]; then
            cat >> dist/RELEASE_NOTES.md <<'SIGNED_EOF'

          ## Signed

          `SHA256SUMS` is signed with the project's minisign key:

          ```bash
          minisign -V -p depannix.pub -m SHA256SUMS
          ```

          Compare the key's fingerprint out of band before trusting it: a public
          key fetched from the same place as the signature proves nothing by
          itself.
          SIGNED_EOF
          else
            cat >> dist/RELEASE_NOTES.md <<'UNSIGNED_EOF'

          ## Not signed

          No minisign key is configured yet, so `SHA256SUMS` ships unsigned. The
          build provenance attestation is the available alternative:

          ```bash
          gh attestation verify <iso file> --repo dbeley/depannix
          ```
          UNSIGNED_EOF
          fi

          cat >> dist/RELEASE_NOTES.md <<'LIMITS_EOF'

          ## Known limitations

          - **The aarch64 boot test is manual.** The free arm64 runners expose no
            `/dev/kvm`, so the aarch64 ISO is built and attested but not booted
            here.
          - **Secure Boot must be disabled.** The image carries no Secure Boot
            signature: minisign signs the checksums, not the boot chain.
          - No persistence and no graphical interface in v1.
          LIMITS_EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The signature is optional: listing SHA256SUMS.minisig
          # unconditionally would fail every unsigned release, while that is the
          # default case.
          #
          # Every artefact a third party needs in order to verify the image is
          # published, not just the ISO: closure-sri.tsv and README.txt are what
          # the verification recipe in the manifest actually consumes. Shipping
          # the proof but not the instructions would be a strange kind of
          # honesty.
          files=(
            "$ISO_DIR"/*.iso
            dist/SHA256SUMS
          )
          # Both architectures ship a manifest, and every file name carries the
          # system it describes. Publishing one un-suffixed set is what allowed the
          # two to overwrite each other, leaving the release with a manifest
          # matching an unstated architecture.
          for s in x86_64-linux aarch64-linux; do
            files+=(
              "$MANIFEST_DIR"/store-paths-$s.txt
              "$MANIFEST_DIR"/closure-$s.json
              "$MANIFEST_DIR"/closure-sri-$s.tsv
              "$MANIFEST_DIR"/total-nar-size-$s.txt
              "$MANIFEST_DIR"/nix-path-registration-$s.txt
              "$MANIFEST_DIR"/MANIFEST-$s.sha256
              "$MANIFEST_DIR"/README-$s.txt
            )
          done
          if [ -f dist/SHA256SUMS.minisig ]; then
            files+=(dist/SHA256SUMS.minisig)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dépannix ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            "${files[@]}"
