name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    # The same filter as `push`. It was missing here, so a PR that only touched
    # a README still paid for four full builds - two flavours on two
    # architectures. A `push` filter alone does not cover that: pull requests are
    # a separate event. Note that a filtered-out PR reports no check at all
    # rather than a green one, so `build` must not be required by branch
    # protection while this is in place.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the release on tag
  id-token: write # build provenance attestation
  attestations: write

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, like the actions and nixpkgs. `ubuntu-latest` migrates to
          # Ubuntu 26 on 2026-10-19: left floating, the build chain would change
          # by itself one working day, with nobody having decided it. Aligned
          # with the arm64 runner, which is pinned too.
          #
          # Both flavours on both architectures, in four jobs rather than one:
          # the desktop image is several times larger, and a failure in it must
          # not hide the minimal one.
          - runner: ubuntu-24.04
            system: x86_64-linux
            flavour: minimal
            kvm: true
          - runner: ubuntu-24.04
            system: x86_64-linux
            flavour: desktop
            kvm: true
          # The free arm64 runners do not expose /dev/kvm (an Azure ARM SKU
          # limitation, not an image one). So we build the aarch64 images but do
          # not boot them here: the aarch64 boot test stays manual, and the
          # graphical tests skip themselves for the same reason. See
          # docs/design.md.
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            flavour: minimal
            kvm: false
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            flavour: desktop
            kvm: false

    steps:
      - uses: actions/checkout@v5

      # Version pinned on purpose: `@main` can change without warning, and thus
      # break a build that used to work, or move the trust chain with no trace.
      # v22 is the latest at the time of writing.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # This action installs Determinate Nix by default, and that is what
          # makes it attempt a FlakeHub login: without a token the login fails
          # and leaves a warning on every run. `flakehub: false` does NOT stop
          # it - the input is deprecated and merely implies `determinate`. The
          # real lever is `determinate`, and switching it off keeps CI on
          # upstream Nix, the same one the development host runs. Verified not to
          # change the artifacts: both distributions produced the same ISO hash,
          # see docs/design.md.
          determinate: false

      - name: Disk headroom before build
        run: df -h /

      - name: Enable KVM (x86_64 only)
        if: matrix.kvm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

          # The runner user is not in the kvm group and we cannot reconnect
          # mid-job: the udev rule is the only workaround that works.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          # Fail immediately if KVM is not there: without this guard rail, QEMU
          # silently falls back to software emulation and the job times out.
          test -w /dev/kvm

      - name: Build the ${{ matrix.flavour }} ISO
        run: nix build .#${{ matrix.flavour }} --out-link result-iso -L

      - name: ISO size
        run: |
          iso=$(find result-iso/iso -name '*.iso' | head -1)
          ls -l "$iso"
          printf 'size: %s MiB\n' "$(( $(stat -c%s "$iso") / 1048576 ))"

      - name: Boot test (BIOS, then EFI)
        if: matrix.kvm && matrix.flavour == 'minimal'
        run: |
          # /dev/kvm must be injected into the sandbox: without that, QEMU falls
          # back to software emulation and the job times out. Enabling KVM on the
          # runner is not enough by itself, because a `nix build` runs in a
          # sandbox that does not expose /dev/kvm.
          #
          # Both firmware paths are covered on the reference flavour; the desktop
          # one is tested in BIOS mode only, which docs/design.md states rather
          # than leaves to be discovered.
          nix build --option extra-sandbox-paths /dev/kvm .#checks.${{ matrix.system }}.boot-test-minimal-bios --out-link result-boot-bios -L
          nix build --option extra-sandbox-paths /dev/kvm .#checks.${{ matrix.system }}.boot-test-minimal-efi --out-link result-boot-efi -L

      - name: Graphical session test
        if: matrix.kvm
        run: |
          # The minimal image has no display manager: the session starts when an
          # operator asks for it, so this test asks for it too, by typing
          # `depannix gui` on the guest console through the QEMU monitor. The
          # desktop image logs itself in.
          #
          # Either way the session then has to report itself on the serial
          # console, as a Wayland client that connected to the compositor, and
          # the captured screen must not be black.
          if [ "${{ matrix.flavour }}" = minimal ]; then
            check=session-minimal-bios
          else
            check=boot-test-desktop-bios
          fi
          nix build --option extra-sandbox-paths /dev/kvm \
            ".#checks.${{ matrix.system }}.$check" --out-link result-boot-gui -L

      - name: Size guard
        run: nix build .#checks.${{ matrix.system }}.size-budget-${{ matrix.flavour }} --out-link result-budget -L

      - name: Composition manifest
        run: nix build .#packages.${{ matrix.system }}.closure-manifest-${{ matrix.flavour }} --out-link result-manifest -L

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: result-iso/iso/*.iso

      - uses: actions/upload-artifact@v7
        with:
          name: depannix-${{ matrix.flavour }}-${{ matrix.system }}
          path: |
            result-iso/iso/*.iso
            result-manifest/*
          if-no-files-found: error

      # The proof that a session came up, published as a picture: a serial log
      # saying so is evidence, a screenshot of the running session is better.
      # Named `session-` and not `depannix-` so that the release job, which
      # downloads `depannix-*`, does not pull it in.
      - uses: actions/upload-artifact@v7
        if: matrix.kvm
        with:
          name: session-${{ matrix.flavour }}-${{ matrix.system }}
          path: |
            result-boot-gui/session.png
            result-boot-gui/serial.log
          if-no-files-found: error

  # The missing link. Everything above was automatic and the last step was not:
  # a green main was built, attested, and then nothing happened, because
  # `release` waits for a `refs/tags/v*` ref and only a person could create one.
  # Worse, the tag a person creates carries its own `push` trigger, so publishing
  # meant building the same commit a second time and releasing the bytes of that
  # second build rather than the ones the tests had just passed on.
  tag:
    name: tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      created: ${{ steps.cut.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag has to name the commit whose artifacts are about to be
          # published, not whatever main points at when this step runs.
          fetch-depth: 0

      - name: Cut the tag
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `git tag -a` refuses to run without a committer identity and checkout
          # sets none, so the tag would fail on the runner with "empty ident".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The version in flake.nix is the one the monthly job wrote and the one
          # embedded in the image, so it is what the tag must say. A date read
          # here would disagree with it in any month where the bump landed late.
          v=$(grep -oP '^\s*version = "\K[^"]+' flake.nix | head -1)
          test -n "$v" || { echo "::error::no version in flake.nix"; exit 1; }
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # One release per version, not one per push to main. A second push in
          # the same month - a typo fix, a workflow tweak - finds the tag and
          # stays quiet. The same guard keeps a feature PR merged before the
          # monthly one from publishing: it carries no version the tag lacks.
          #
          # "Tagged" is not the same condition as "released", and conflating them
          # is how 2026.11 stayed a tag with no release page: the tag was cut, the
          # publish step failed, and every later push found the tag and published
          # nothing, for ever. A version whose release page is missing is
          # therefore retried from this run's artifacts rather than skipped. The
          # images are byte-identical build to build, so retrying from a later
          # commit publishes the same bytes, and the tag keeps naming the commit
          # that first earned it.
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            if gh release view "$tag" --json tagName >/dev/null 2>&1; then
              echo "$tag is tagged and released, nothing to publish"
              echo "created=false" >> "$GITHUB_OUTPUT"
            else
              echo "$tag is tagged but has no release: publishing it now"
              echo "created=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

          # Annotated, so the tag itself records which run earned it: the release
          # is published from this run's artifacts, and a reader of `git log` can
          # get back to the four builds and two boot tests behind it.
          #
          # Pushing it does not start a second build. `ci.yml` triggers on `v*`
          # tags, but the tag is pushed with the default `GITHUB_TOKEN` and GitHub
          # suppresses the runs that token creates - the same rule that forced
          # monthly.yml to dispatch its CI by hand. A tag pushed by a person still
          # builds and releases on its own, which is the recovery path when the
          # publish step below fails on a tag that is already cut.
          git tag -a "$tag" -m "Dépannix $v" -m "Built, boot-tested and attested by $RUN_URL"
          git push origin "$tag"

  release:
    name: release
    needs: [build, tag]
    # Two ways in, one set of artifacts. A `v*` tag pushed by hand builds the tag
    # and releases it, as before. A green push to main is tagged just above and
    # released from the very run that tested it: no third build, and the
    # published bytes are the ones the boot tests ran on. `always()` is needed
    # because one of the two paths always leaves `tag` skipped, and a skipped
    # need skips its dependants by default.
    if: >-
      always()
      && needs.build.result == 'success'
      && (startsWith(github.ref, 'refs/tags/v')
          || needs.tag.outputs.created == 'true')
    runs-on: ubuntu-24.04
    # download-artifact preserves the structure the upload used. The upload
    # matched two path patterns, so the least common ancestor is the repository
    # root and the files keep their prefixes. Verified by downloading an artifact
    # and listing it, rather than by reading the action's documentation.
    env:
      ISO_DIR: dist/result-iso/iso
      MANIFEST_DIR: dist/result-manifest
    steps:
      - uses: actions/checkout@v5

      # Resolved in a step, not from `needs` in the job's `env`. There a name
      # that fails to resolve is simply empty, and an empty name made
      # `gh release create` fail in three seconds with a message that no longer
      # exists anywhere: the log endpoint needs admin, and the step printed to
      # stdout. So the name is computed, validated, and printed here, and a bad
      # one stops the job before anything is half-published.
      - name: Resolve the release name
        id: name
        env:
          FROM_TAG_JOB: ${{ needs.tag.outputs.tag }}
        run: |
          name="${FROM_TAG_JOB:-$GITHUB_REF_NAME}"
          case "$name" in
            v[0-9]*) ;;
            *)
              echo "::error::refusing to publish: '$name' is neither a v* tag nor a tag cut by the tag job"
              exit 1
              ;;
          esac
          echo "value=$name" >> "$GITHUB_OUTPUT"
          echo "release name: $name"

      - uses: actions/download-artifact@v8
        with:
          pattern: depannix-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l "$ISO_DIR" "$MANIFEST_DIR"
          # Strip the directory prefixes so the sums carry bare file names and
          # `sha256sum -c SHA256SUMS` works from the download directory. The two
          # manifests are covered too, so the signed file vouches for the proof
          # as well as for the image.
          {
            sha256sum "$ISO_DIR"/*.iso
            sha256sum "$MANIFEST_DIR"/closure-*.json "$MANIFEST_DIR"/closure-sri-*.tsv
          } | sed -e "s|$ISO_DIR/||" -e "s|$MANIFEST_DIR/||" > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # Signing stays optional: the job must not fail when the secret is not
      # configured, but we want to know whether it happened.
      - name: Detect the signing key
        id: sig
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY is absent - the release will not be signed"
          fi

      # The `release` job does not share the `build` job environment: without
      # this step, `nix` does not exist here and signing fails.
      - name: Install Nix (for minisign)
        if: steps.sig.outputs.enabled == 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      # minisign reads the password neither from the environment nor from stdin:
      # it asks the terminal, which CI does not have. The key stored in the
      # secret must therefore be UNENCRYPTED (`minisign -G -W`), otherwise this
      # step fails. It is the only non-interactive mode supported upstream.
      - name: Sign
        if: steps.sig.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.minisign
          printf '%s\n' "$MINISIGN_KEY" > ~/.minisign/depannix.key
          nix run nixpkgs#minisign -- -S -s ~/.minisign/depannix.key \
            -m dist/SHA256SUMS
          rm -f ~/.minisign/depannix.key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

      - name: Release notes
        run: |
          # Generated rather than left to --generate-notes, which on a first
          # release produces nothing but a changelog link. The release page is
          # where a visitor lands: it should say what the artefact is, how to
          # verify it, and what it does not do.
          {
            echo "NixOS rescue images: diagnosis, benchmarks, repair, partitioning"
            echo "and cloning. Boot tested under KVM by CI, graphical session"
            echo "included."
            echo
            echo "**On an ordinary PC, take an \`x86_64\` image.** There are two"
            echo "flavours: \`depannix-minimal-*\` is the small one, a console with a"
            echo "Wayland session on demand; \`depannix-desktop-*\` adds GNOME and"
            echo "Firefox. The other assets are the proof of what is inside them."
            echo
            for iso in "$ISO_DIR"/*.iso; do
              f=$(basename "$iso")
              s=$(stat -c%s "$iso")
              printf -- '- `%s` (%d bytes, %s MiB)\n' "$f" "$s" \
                "$(awk -v s="$s" 'BEGIN { printf "%.1f", s / 1048576 }')"
            done
            echo
            echo "| file | what it is for |"
            echo "|---|---|"
            echo '| `depannix-minimal-<release>-<system>.iso` | the console image, with a Wayland session on demand |'
            echo '| `depannix-desktop-<release>-<system>.iso` | the same, plus GNOME and Firefox |'
            echo '| `closure-<flavour>-<system>.json` | every embedded store path, with its NAR hash and size |'
            echo '| `closure-sri-<flavour>-<system>.tsv` | the same paths and hashes, in the encoding narinfo files use |'
            echo '| `SHA256SUMS` | the hashes of all of the above, signed |'
            echo
            for f in minimal desktop; do
              for s in x86_64-linux aarch64-linux; do
                printf -- '- **%s / %s**: %s store paths, %s bytes of NAR.\n' "$f" "$s" \
                  "$(jq 'length' "$MANIFEST_DIR/closure-$f-$s.json")" \
                  "$(jq 'map(.narSize) | add' "$MANIFEST_DIR/closure-$f-$s.json")"
              done
            done
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/RELEASE_NOTES.md

          cat >> dist/RELEASE_NOTES.md <<'NOTES_EOF'

          ## Verify

          ```bash
          sha256sum -c SHA256SUMS
          ```

          The composition is published too, and can be checked against
          `cache.nixos.org` without trusting this build: one plain GET per
          store path, comparing the answer with the `narHash` in
          `closure-<system>.json`. The full recipe is in the project README.
          NOTES_EOF

          # Signing is optional, and the release page must not claim the opposite
          # of what it ships: a hard-coded "not signed" section would quietly turn
          # into a lie the day the key is configured.
          if [ "${{ steps.sig.outputs.enabled }}" = "true" ]; then
            cat >> dist/RELEASE_NOTES.md <<'SIGNED_EOF'

          ## Signed

          `SHA256SUMS` is signed with the project's minisign key:

          ```bash
          minisign -V -p depannix.pub -m SHA256SUMS
          ```

          Compare the key's fingerprint out of band before trusting it: a public
          key fetched from the same place as the signature proves nothing by
          itself.
          SIGNED_EOF
          else
            cat >> dist/RELEASE_NOTES.md <<'UNSIGNED_EOF'

          ## Not signed

          No minisign key is configured yet, so `SHA256SUMS` ships unsigned. The
          build provenance attestation is the available alternative:

          ```bash
          gh attestation verify <iso file> --repo dbeley/depannix
          ```
          UNSIGNED_EOF
          fi

          cat >> dist/RELEASE_NOTES.md <<'LIMITS_EOF'

          ## Known limitations

          - **The aarch64 boot test is manual.** The free arm64 runners expose no
            `/dev/kvm`, so the aarch64 ISO is built and attested but not booted
            here.
          - **Secure Boot must be disabled.** The image carries no Secure Boot
            signature: minisign signs the checksums, not the boot chain.
          - **No persistence.** Nothing done in a session survives a reboot: this
            is a live medium, and v1 has no way to keep anything on the stick.
          - **The disk you plug in is not mounted for you.** Automount is off in
            both images, including in GNOME, where the default would mount, write
            to, and replay the journal of the very disk being rescued.
          LIMITS_EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.name.outputs.value }}
        run: |
          # The signature is optional: listing SHA256SUMS.minisig
          # unconditionally would fail every unsigned release, while that is the
          # default case.
          #
          # Every artefact a third party needs in order to verify the image is
          # published, not just the ISO: closure-sri.tsv and README.txt are what
          # the verification recipe in the manifest actually consumes. Shipping
          # the proof but not the instructions would be a strange kind of
          # honesty.
          files=(
            "$ISO_DIR"/*.iso
            dist/SHA256SUMS
          )
          # Two files per build, and no more. A release page with a dozen assets
          # already buries the one file a visitor came for. Dropped as
          # redundant or derivable: the bare path list and the total NAR size
          # (both one jq call on the JSON), the per-architecture README (its
          # content is in the release notes and in the project README), the
          # manifest's own checksums (SHA256SUMS covers them now), and the
          # registration file, which rebuilding
          # `.#packages.<system>.closure-manifest-<flavour>` regenerates.
          #
          # Every published name carries both the flavour and the system it
          # describes, because all four builds have a different closure and a
          # manifest that does not say which build it belongs to is a manifest a
          # verifier applies to the wrong image. This loop was not updated when
          # `flavour` joined the name: it kept asking for `closure-<system>.json`,
          # a file that had been renamed, so `gh release create` was handed four
          # paths that did not exist and gave up in three seconds without
          # uploading anything. The pre-flight below now names such a path before
          # gh is called at all.
          for f in minimal desktop; do
            for s in x86_64-linux aarch64-linux; do
              files+=(
                "$MANIFEST_DIR"/closure-$f-$s.json
                "$MANIFEST_DIR"/closure-sri-$f-$s.tsv
              )
            done
          done
          if [ -f dist/SHA256SUMS.minisig ]; then
            files+=(dist/SHA256SUMS.minisig)
          fi

          # Pre-flight, then a call whose stderr is captured and re-emitted as an
          # annotation. Both exist because of 2026.11: the step failed in three
          # seconds, the job went red, and the reason was in a log only a repo
          # admin could open. An annotation is readable afterwards, by anyone.
          test -n "$TAG_NAME" || { echo "::error::TAG_NAME is empty"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::missing asset: $f"; exit 1; }
          done
          [ -s dist/RELEASE_NOTES.md ] || { echo "::error::dist/RELEASE_NOTES.md is empty or missing"; exit 1; }
          printf 'release %s with %d assets\n' "$TAG_NAME" "${#files[@]}"

          if ! output=$(gh release create "$TAG_NAME" \
                 --title "Dépannix $TAG_NAME" \
                 --notes-file dist/RELEASE_NOTES.md \
                 "${files[@]}" 2>&1); then
            # One line, because that is what an annotation renders; the full text
            # stays in the log for whoever can read it.
            echo "::error::gh release create $TAG_NAME failed: $(printf '%s' "$output" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          printf '%s\n' "$output"
