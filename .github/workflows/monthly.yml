name: monthly

# One release a month, with no human intervention: we follow nixpkgs-unstable,
# open a pull request, CI builds and tests it, and the merge triggers a release.
# The vYYYY.MM tag is applied by hand after the merge (or by an automatic tag if
# you prefer - CI does exactly the same thing either way).
on:
  schedule:
 - cron: "0 6 1 * *" # 06:00 UTC on the 1st of the month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # start CI on the pull request, see the last step

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
 - uses: actions/checkout@v5

 - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # `flakehub: false` is a no-op: the input is deprecated and merely
          # implies `determinate`, whose default is already true. The lever is
          # `determinate: false`, which installs upstream Nix - same as ci.yml.
          determinate: false

 - name: Update flake.lock
        run: nix flake update

 - name: Update the CalVer version
        id: version
        run: |
          v=$(date -u +%Y.%m)
          sed -i -E "s/^([[:space:]]*version = \")[0-9]{4}\.[0-9]{2}(\";.*)$/\1${v}\2/" flake.nix
          grep -n 'version = "' flake.nix
          echo "value=$v" >> "$GITHUB_OUTPUT"

 - name: Summary of the nixpkgs change
        run: |
          {
            echo "### nixpkgs"
            echo
            echo '```'
            nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked | "rev  \(.rev)\ndate \(.lastModified | todate)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

 - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/${{ steps.version.outputs.value }}
          title: "release: ${{ steps.version.outputs.value }}"
          commit-message: "release: ${{ steps.version.outputs.value }}"
          body: |
            Automated monthly update.

 - `flake.lock` follows `nixos-unstable`
 - CalVer version → `${{ steps.version.outputs.value }}`

            CI builds the ISO, runs the BIOS and EFI boot tests, checks the size
            budget and publishes the composition manifest.

            **Do not merge if any test fails**: we then stay on the last green
            month. That is the rule that keeps a release from breaking silently.
          delete-branch: true

      # A pull request opened with the default GITHUB_TOKEN does not trigger
      # `pull_request` workflows: GitHub suppresses the runs created by that
      # token, to prevent loops. Without this step the monthly PR would land with
      # no CI at all - while its own body promises a build, two boot tests and a
      # manifest. `workflow_dispatch` is the documented exception to that rule,
      # which is why ci.yml accepts it.
 - name: Start CI on the pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "release/${{ steps.version.outputs.value }}"

      # A month in which nixpkgs has not moved and the version is already current
      # produces no diff, and therefore no branch: the dispatch above then fails
      # with an HTTP 422 on a ref that was never created. Say so instead. This is
      # the normal case if the job is re-run inside the same month.
 - name: Nothing to release this month
        if: steps.pr.outputs.pull-request-number == ''
        run: |
          {
            echo "### Nothing to release this month"
            echo
            echo "nixpkgs is already at the pinned revision and the version is"
            echo "current, so no pull request was opened and no CI was started."
          } >> "$GITHUB_STEP_SUMMARY"
